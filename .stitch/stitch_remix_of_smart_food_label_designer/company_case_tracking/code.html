<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Company &amp; Case Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-container": "#5c647a",
                        "primary": "#006e2f",
                        "tertiary-fixed-dim": "#adc6ff",
                        "outline-variant": "#bccbb9",
                        "on-primary-container": "#004b1e",
                        "on-tertiary-container": "#003d88",
                        "tertiary-container": "#82abff",
                        "secondary-fixed-dim": "#bec6e0",
                        "tertiary": "#005ac2",
                        "surface": "#f7f9fb",
                        "inverse-primary": "#4ae176",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#002109",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-primary": "#ffffff",
                        "secondary-container": "#dae2fd",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "primary-container": "#22c55e",
                        "surface-dim": "#d8dadc",
                        "inverse-on-surface": "#eff1f3",
                        "on-surface-variant": "#3d4a3d",
                        "on-background": "#191c1e",
                        "on-secondary-fixed": "#131b2e",
                        "secondary": "#565e74",
                        "secondary-fixed": "#dae2fd",
                        "primary-fixed-dim": "#4ae176",
                        "inverse-surface": "#2d3133",
                        "on-tertiary-fixed": "#001a42",
                        "surface-bright": "#f7f9fb",
                        "outline": "#6d7b6c",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f2f4f6",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#3f465c",
                        "surface-tint": "#006e2f",
                        "surface-container": "#eceef0",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "background": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#6bff8f",
                        "on-primary-fixed-variant": "#005321"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xxl": "48px",
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "lg": "24px",
                        "base": "4px",
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "sm": "8px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    fontFamily: {
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-md": ["14px", { lineHeight: "16px", fontWeight: "600" }],
                        "label-sm": ["12px", { lineHeight: "16px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-lg-mobile": ["28px", { lineHeight: "34px", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for timeline */
        .timeline-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .timeline-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .timeline-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased md:hidden pb-safe">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm dark:shadow-none docked full-width top-0 z-50 sticky transition-colors duration-200 flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-weight="fill">account_circle</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary dark:text-inverse-primary">EnforceMetrology</span>
</div>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant dark:hover:bg-surface-variant/20 rounded-full p-2 transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant">notifications</span>
</button>
</header>
<main class="px-margin-mobile py-lg pb-24">
<!-- Search Bar -->
<div class="relative mb-lg">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-xl leading-5 bg-surface-container-low placeholder-on-surface-variant focus:outline-none focus:bg-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-sm text-on-surface sm:text-sm transition-colors duration-200" id="searchInput" placeholder="Search companies, cases..." type="text"/>
</div>
<!-- Company Cards List -->
<div class="space-y-gutter" id="companyList">
<!-- Card 1 -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-gutter flex flex-col gap-sm relative overflow-hidden group hover:shadow-md transition-shadow duration-200" onclick="toggleTimeline('timeline-1')">
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">Apex Foods Inc.</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">location_on</span> Dist 4, Sector B
                        </p>
</div>
<div class="flex flex-col items-end">
<span class="bg-error-container text-on-error-container font-label-sm text-label-sm px-2 py-1 rounded-md mb-1">2 Open Violations</span>
</div>
</div>
<div class="h-px bg-surface-variant w-full my-xs"></div>
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined">verified</span>
<span class="font-label-md text-label-md">Compliance: 82%</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">expand_more</span>
</div>
<!-- Hidden Timeline (Expands on click) -->
<div class="hidden w-full mt-md pt-sm border-t border-surface-variant relative before:absolute before:inset-y-0 before:left-[11px] before:w-px before:bg-surface-variant" id="timeline-1">
<div class="relative pl-xl pb-md">
<div class="absolute left-0 top-1 w-6 h-6 rounded-full bg-error-container border-2 border-surface-container-lowest flex items-center justify-center z-10">
<div class="w-2 h-2 rounded-full bg-error"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-xs">Oct 12, 2023</p>
<p class="font-body-sm text-body-sm font-semibold text-on-surface">Violation Filed: Mislabeling</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs line-clamp-2">Incorrect allergen information on batch #4492.</p>
</div>
<div class="relative pl-xl pb-md">
<div class="absolute left-0 top-1 w-6 h-6 rounded-full bg-primary-container border-2 border-surface-container-lowest flex items-center justify-center z-10">
<div class="w-2 h-2 rounded-full bg-primary"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-xs">Sep 05, 2023</p>
<p class="font-body-sm text-body-sm font-semibold text-on-surface">Routine Audit Passed</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs line-clamp-2">Standard facility inspection completed with minor notes.</p>
</div>
</div></button><button class="mt-sm w-full py-2 bg-surface-container-low text-primary font-label-md text-label-md rounded-lg hover:bg-surface-variant transition-colors">View Full History</button>
</div>
<!-- Card 2 -->
<button class="w-full text-left bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-gutter flex flex-col gap-sm relative overflow-hidden group hover:shadow-md transition-shadow duration-200" onclick="toggleTimeline('timeline-2')">
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">GreenValley Organics</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-sm">location_on</span> Dist 1, Sector A
                        </p>
</div>
<div class="flex flex-col items-end">
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-2 py-1 rounded-md mb-1">No Active Violations</span>
</div>
</div>
<div class="h-px bg-surface-variant w-full my-xs"></div>
<div class="flex justify-between items-center w-full">
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined text-primary">verified</span>
<span class="font-label-md text-label-md text-primary">Compliance: 98%</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">expand_more</span>
</div>
<div class="hidden w-full mt-md pt-sm border-t border-surface-variant relative before:absolute before:inset-y-0 before:left-[11px] before:w-px before:bg-surface-variant" id="timeline-2">
<div class="relative pl-xl pb-md">
<div class="absolute left-0 top-1 w-6 h-6 rounded-full bg-primary-container border-2 border-surface-container-lowest flex items-center justify-center z-10">
<div class="w-2 h-2 rounded-full bg-primary"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-xs">Nov 01, 2023</p>
<p class="font-body-sm text-body-sm font-semibold text-on-surface">Certification Renewed</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs line-clamp-2">Organic standard verification passed successfully.</p>
</div>
</div></button><button class="mt-sm w-full py-2 bg-surface-container-low text-primary font-label-md text-label-md rounded-lg hover:bg-surface-variant transition-colors">View Full History</button>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface dark:bg-surface-container-lowest shadow-lg dark:shadow-none docked full-width bottom-0 rounded-t-xl fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe border-t border-surface-variant">
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-4 py-1 scale-95 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-weight="fill">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-secondary-container/50 dark:hover:bg-secondary-container/10 scale-95 active:scale-90 transition-transform duration-150 rounded-full">
<span class="material-symbols-outlined">assignment_turned_in</span>
<span class="font-label-sm text-label-sm mt-1">Audit</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-secondary-container/50 dark:hover:bg-secondary-container/10 scale-95 active:scale-90 transition-transform duration-150 rounded-full">
<span class="material-symbols-outlined">gavel</span>
<span class="font-label-sm text-label-sm mt-1">Violations</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-secondary-container/50 dark:hover:bg-secondary-container/10 scale-95 active:scale-90 transition-transform duration-150 rounded-full">
<span class="material-symbols-outlined">inbox</span>
<span class="font-label-sm text-label-sm mt-1">Inbox</span>
</button>
</nav>
<script>
        function toggleTimeline(id) {
            const timeline = document.getElementById(id);
            const icon = timeline.parentElement.querySelector('.material-symbols-outlined:last-child');
            
            if (timeline.classList.contains('hidden')) {
                timeline.classList.remove('hidden');
                icon.textContent = 'expand_less';
            } else {
                timeline.classList.add('hidden');
                icon.textContent = 'expand_more';
            }
        }
    </script>
</body></html>
