[project]
name = "ml-scanner"
version = "1.0.0"
description = "FastAPI service wrapping the Legal Metrology ML compliance pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── ML pipeline (verbatim from source repo requirements.txt) ──
    "easyocr>=1.7",
    "interpret>=0.6",
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "fpdf2>=2.7",
    "numpy>=1.24",
    "pyzbar>=0.1.9",
    "regex>=2024.5",
    "requests>=2.31",
    # ── FastAPI wrapper ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pytesseract>=0.3.13",
]

[tool.uv]
package = false
