name: Build & Release (APK + IPA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.6)'
        required: true
        default: 'v1.0.6'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build APK & IPA and Release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Artifacts Directory
        run: mkdir -p "$GITHUB_WORKSPACE/release-assets"

      # ── 1. Build Android APK ──
      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}.apk"

      # ── 2. Build iOS Unsigned IPA ──
      - name: Disable Apple Team Requirement
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}.ipa" Payload
        working-directory: apps/mobile/build/ios/iphoneos

      # ── 3. Publish GitHub Release ──
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.vars.outputs.VERSION }}" \
            "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}.apk" \
            "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}.ipa" \
            --title "LabelLens ${{ steps.vars.outputs.VERSION }}" \
            --notes "### LabelLens Mobile App Release ${{ steps.vars.outputs.VERSION }}

          #### 📦 Downloads:
          - **Android APK**: \`LabelLens-${{ steps.vars.outputs.VERSION }}.apk\`
          - **iOS IPA (Unsigned)**: \`LabelLens-${{ steps.vars.outputs.VERSION }}.ipa\` *(Install via AltStore / Sideloadly / TrollStore / Scarlet)*

          #### 🚀 Highlights:
          - Fast ML Scanner connectivity with keep-alive integration
          - Local parallel probing with instant fallback
          - R8 ProGuard optimizations for Android release
          - Standalone offline/online compliance scanning"
