name: Build & Release (APK + IPA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.7)'
        required: true
        default: 'v1.0.7'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build APKs & IPA and Release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Artifacts Directory
        run: mkdir -p "$GITHUB_WORKSPACE/release-assets"

      # ── 1. Build Universal Android APK ──
      - name: Build Universal Android APK
        run: flutter build apk --release

      - name: Prepare Universal APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}-universal.apk"

      # ── 2. Build Split Android APK (arm64-v8a slim) ──
      - name: Build Split Android APKs (arm64-v8a)
        run: flutter build apk --split-per-abi --release

      - name: Prepare arm64-v8a APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk"

      # ── 3. Build iOS Unsigned IPA ──
      - name: Disable Apple Team Requirement
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}.ipa" Payload
        working-directory: apps/mobile/build/ios/iphoneos

      # ── 4. Publish GitHub Release ──
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.vars.outputs.VERSION }}" \
            "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk#LabelLens-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk" \
            "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}-universal.apk#LabelLens-${{ steps.vars.outputs.VERSION }}-universal.apk" \
            "$GITHUB_WORKSPACE/release-assets/LabelLens-${{ steps.vars.outputs.VERSION }}.ipa#LabelLens-${{ steps.vars.outputs.VERSION }}.ipa" \
            --title "LabelLens ${{ steps.vars.outputs.VERSION }}" \
            --notes "### LabelLens Mobile App Release ${{ steps.vars.outputs.VERSION }}

          #### 📦 Available Downloads:

          | File | Size | Description |
          | :--- | :--- | :--- |
          | **\`LabelLens-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk\`** | **~41 MB** | ⚡ **Recommended** for modern Android devices (64-bit ARM phones) |
          | **\`LabelLens-${{ steps.vars.outputs.VERSION }}-universal.apk\`** | **~105 MB** | 🌐 **Universal** — compatible with all Android devices, tablets & emulators |
          | **\`LabelLens-${{ steps.vars.outputs.VERSION }}.ipa\`** | **~31 MB** | 🍎 **iOS Unsigned** (Install via AltStore / Sideloadly / TrollStore / Scarlet) |

          #### 🚀 Highlights:
          - Optimized package size: 60% smaller download with \`arm64-v8a\` APK
          - Universal APK maintained for legacy devices & emulator testing
          - Fast ML Scanner connectivity with keep-alive integration
          - Local parallel probing with instant fallback
          - R8 ProGuard optimizations for Android release"
